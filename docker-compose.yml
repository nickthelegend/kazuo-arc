services:
  broker:
    build: .
    ports:
      - "8402:8402"
    environment:
      # Claim Arc testnet USDC at https://faucet.circle.com (Arc Testnet).
      # Only a key: the operator's address is derived from it.
      KAZUO_OPERATOR_KEY: ${KAZUO_OPERATOR_KEY:?set this in .env}
      KAZUO_NETWORK: ${KAZUO_NETWORK:-eip155:5042002}
      KAZUO_RPC_URL: ${KAZUO_RPC_URL:-}
      # The KazuoLog contract. Deploy with `pnpm deploy:log`. Blank is allowed —
      # the network runs, it just records nothing publicly.
      KAZUO_LOG_ADDRESS: ${KAZUO_LOG_ADDRESS:-}
      KAZUO_LOG_FROM_BLOCK: ${KAZUO_LOG_FROM_BLOCK:-}
      # How this broker is reachable from OUTSIDE the container. It is used for
      # receipt links and quote URLs, and the default is genuinely wrong here: a
      # container publishing 8402 to some other host port, or sitting behind a
      # tunnel, is not at localhost:8402 as far as anyone else is concerned.
      #
      # Provider nodes no longer depend on it — they derive the control-channel
      # URL from the address they actually reached the broker on, because
      # getting this wrong used to leave a node reporting `online` while every
      # dispatched job silently died.
      KAZUO_BROKER_URL: ${KAZUO_BROKER_URL:-http://localhost:8402}
      KAZUO_CORS_ORIGINS: ${KAZUO_CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
      # Behind a reverse proxy, set this so rate limiting sees real client IPs.
      KAZUO_TRUST_PROXY: ${KAZUO_TRUST_PROXY:-0}
    volumes:
      # Jobs and lifetime earnings. Without this they go with the container.
      - kazuo-data:/data
    restart: unless-stopped

volumes:
  kazuo-data:
